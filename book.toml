[book]
title = "ayaml"
description = "Safe, pure-Rust YAML 1.2.2 parser, event stream, value model, Serde layer, and emitter"
authors = ["ayaml contributors"]
language = "en"
src = "docs"

[output.html]
site-url = "/ayaml/"
git-repository-url = "https://github.com/asamarts/ayaml"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.playground]
runnable = false

[output.html.search]
enable = true

[build]
build-dir = "target/book"
create-missing = false
