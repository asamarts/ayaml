root: aplan
traces_root: .
# The one version declaration in the workspace manifest. `aplan version` reads the
# version the artifact ships today and the work closed since the last release tag.
version:
  current:
    command: [sed, -n, 's/^version = "\(.*\)"/\1/p', Cargo.toml]
require_effort: true
require_cut_membership: true
deny_warnings: true

evidence:
  require_min_strength: [test]
  exempt_tags: [untestable, milestone]

test:
  list: [cargo, test, --workspace, --all-features, --, --list]
  # The address-space and time limits stop a resource bug from taking down the host.
  run:
    - bash
    - -c
    - 'ulimit -v 8388608; exec timeout -k 5 300 cargo test --workspace --all-features -- --exact "$1"'
    - aplan-test
    - '{test}'
