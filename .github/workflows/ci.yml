name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.88.0"
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --all-features
      - name: Adversarial tests in a release build
        run: cargo test -p ayaml --locked --release --all-features --test adversarial
      - name: Documentation
        run: cargo doc --workspace --locked --no-deps --all-features

  suite:
    name: YAML Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Default profile
        run: AYAML_STRICT_SUITE=1 cargo run --locked -p ayaml-conformance -- tests/fixtures tests/data/yaml-test-suite/src
      - name: Compatibility profile
        run: AYAML_STRICT_SUITE=1 cargo run --locked -p ayaml-conformance --features compat -- tests/fixtures tests/data/yaml-test-suite/src

  package:
    name: package and downstream smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: cargo package -p ayaml --locked
      - name: Downstream smoke
        run: |
          set -e
          tmp="${RUNNER_TEMP}/ayaml-downstream"
          rm -rf "$tmp"
          cargo new --quiet "$tmp"
          printf '\n[dependencies]\nayaml = { path = "%s/target/package/ayaml-0.1.0" }\n' "$GITHUB_WORKSPACE" >> "$tmp/Cargo.toml"
          cargo check --quiet --manifest-path "$tmp/Cargo.toml"

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check
        run: cargo check --locked --all-features --target ${{ matrix.target }}

  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test
        run: cargo test --workspace --locked --all-features
      - name: Documentation
        run: cargo doc --workspace --locked --no-deps --all-features

  policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Classify dependencies
        run: python3 tools/check_deps.py
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Unsafe census
        run: cargo geiger --manifest-path crates/ayaml/Cargo.toml --all-features --output-format Json > "${RUNNER_TEMP}/geiger.json"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
