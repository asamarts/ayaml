name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow runs this as its gate.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.88.0"
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --all-features
      - name: Test with default features
        run: cargo test -p ayaml --locked
      - name: Adversarial tests in a release build
        run: cargo test -p ayaml --locked --release --all-features --test adversarial
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --no-deps --all-features

  suite:
    name: YAML Test Suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Default profile
        run: AYAML_STRICT_SUITE=1 cargo run --locked -p ayaml-conformance -- tests/fixtures tests/data/yaml-test-suite/src
      - name: Compatibility profile
        run: AYAML_STRICT_SUITE=1 cargo run --locked -p ayaml-conformance --features compat -- tests/fixtures tests/data/yaml-test-suite/src

  allocation:
    name: allocation budgets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Allocation budgets
        run: tools/check_alloc_corpus.sh
      - name: Benchmarks compile
        run: cargo bench --locked -p ayaml-bench --no-run
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins

  instructions:
    name: instruction counts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install valgrind
        run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Compare with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/check_instructions.py "$BASE_SHA"

  plan:
    name: plan check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install aplan
        run: cargo install aplan --version 0.6.0 --locked
      - name: Check the plan
        run: aplan check

  package:
    name: package and downstream smoke
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Package
        run: cargo package -p ayaml --locked
      - name: The package holds the commit's files
        run: python3 tools/check_release.py package target/package/ayaml-*.crate "$(git rev-parse HEAD)"
      - name: Downstream smoke
        run: |
          set -e
          tmp="${RUNNER_TEMP}/ayaml-downstream"
          rm -rf "$tmp"
          cargo new --quiet "$tmp"
          package="$(find "$GITHUB_WORKSPACE/target/package" -maxdepth 1 -type d -name 'ayaml-*' | head -n1)"
          test -n "$package"
          printf '\nayaml = { path = "%s" }\n' "$package" >> "$tmp/Cargo.toml"
          cargo check --quiet --manifest-path "$tmp/Cargo.toml"

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check
        run: cargo check --locked --all-features --target ${{ matrix.target }}

  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Test
        run: cargo test --workspace --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --no-deps --all-features

  policy:
    name: dependency policy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Test the checks
        run: python3 tools/test_ci_checks.py
      - name: Classify dependencies
        run: python3 tools/check_deps.py
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --version 0.14.0 --locked
      - name: Unsafe census
        run: cargo geiger --manifest-path "$GITHUB_WORKSPACE/crates/ayaml/Cargo.toml" --all-features --output-format Json > "${RUNNER_TEMP}/geiger.json"
      - name: Evaluate the census
        run: python3 tools/check_unsafe_census.py "${RUNNER_TEMP}/geiger.json"

  semver:
    name: semver checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install the pinned cargo-semver-checks
        run: tools/install-semver-checks.sh "${RUNNER_TEMP}/semver-checks" >> "$GITHUB_PATH"
      - name: cargo-semver-checks
        run: cargo semver-checks --package ayaml

  minimal-versions:
    name: minimal versions
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Select minimal versions
        run: cargo update -Z minimal-versions
      - name: Test minimal graph
        run: cargo test --workspace --all-features

  secrets:
    name: secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          # The scanner's image, by tag and digest. The action runs the latest one otherwise.
          # Dependabot moves only the action, and tools/test_ci_checks.py fails until this names
          # the same version: take the digest of ghcr.io/trufflesecurity/trufflehog at that tag.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --only-verified
