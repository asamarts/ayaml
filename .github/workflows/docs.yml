name: docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "Cargo.toml"
      - "tools/check_docs.py"
      - "crates/ayaml-conformance/Cargo.toml"
      - "crates/ayaml-conformance/src/lib.rs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "Cargo.toml"
      - "tools/check_docs.py"
      - "crates/ayaml-conformance/Cargo.toml"
      - "crates/ayaml-conformance/src/lib.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check documentation links and coverage
        run: python3 tools/check_docs.py
      - name: Install site dependencies
        run: npm --prefix site install --no-audit --no-fund
      - name: Build Astro + Starlight site
        run: npm --prefix site run build
      - name: Check built site internal links and fragments
        run: npm --prefix site run check:links
      - name: Doctest every documentation page
        run: cargo test --doc -p ayaml-conformance --all-features --locked
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy docs site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
