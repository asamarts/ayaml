name: docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "book.toml"
      - "README.md"
      - "tools/check_docs.py"
      - "crates/ayaml-conformance/src/lib.rs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - "README.md"
      - "tools/check_docs.py"
      - "crates/ayaml-conformance/src/lib.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build book
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Check documentation links and coverage
        run: python3 tools/check_docs.py
      - name: Build mdBook
        run: mdbook build
      - name: Doctest every book page
        run: cargo test --doc -p ayaml-conformance --all-features --locked
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: deploy book
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
