name: advisories

# The dependency policy job reads the advisory database on every pull request. This finds an
# advisory published when no pull request is open.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: advisory scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install the pinned cargo-deny
        run: tools/install-cargo-deny.sh "${RUNNER_TEMP}/cargo-deny" >> "$GITHUB_PATH"
      - name: cargo-deny
        run: cargo deny --log-level warn --all-features check advisories
