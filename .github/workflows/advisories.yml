name: advisories

# The dependency policy job reads the advisory database on every pull request. This finds an
# advisory published when no pull request is open.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: advisory scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
