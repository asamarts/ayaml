name: mutants

# Weekly bounded mutation testing on hosted runners only (AY-037, AY-171).
# Limit-disabling mutants are excluded in `.cargo/mutants.toml`, and every
# shard runs inside a strict virtual-memory and wall-clock bound.
# Exit code 2 (surviving mutants) and any shard with non-empty `mutants.out/missed.txt`
# (even when exit code 3 also reports an infinite-loop timeout) fail the job so
# `scheduled-watch.yml` surfaces regressions immediately.
on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutants ayaml (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "0/24"
          - "1/24"
          - "2/24"
          - "3/24"
          - "4/24"
          - "5/24"
          - "6/24"
          - "7/24"
          - "8/24"
          - "9/24"
          - "10/24"
          - "11/24"
          - "12/24"
          - "13/24"
          - "14/24"
          - "15/24"
          - "16/24"
          - "17/24"
          - "18/24"
          - "19/24"
          - "20/24"
          - "21/24"
          - "22/24"
          - "23/24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run bounded mutation shard (ayaml)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          (
            # Run one mutant at a time under a 6 GiB per-process cap so infinite-allocation loop
            # mutants cannot stack across parallel jobs and OOM-kill the 16 GiB hosted runner VM.
            ulimit -v 6291456 || exit 125
            timeout -k 10 2700 nice -n 10 cargo mutants \
              --package ayaml \
              --features libyaml-compat,bench-internals \
              --file crates/ayaml/src/span.rs \
              --file crates/ayaml/src/position.rs \
              --file crates/ayaml/src/options.rs \
              --file crates/ayaml/src/spanned.rs \
              --file crates/ayaml/src/emitter.rs \
              --file crates/ayaml/src/frontmatter.rs \
              --file crates/ayaml/src/merge.rs \
              --file crates/ayaml/src/merge/events.rs \
              --file crates/ayaml/src/error.rs \
              --file crates/ayaml/src/resolver.rs \
              --file crates/ayaml/src/composer.rs \
              --file crates/ayaml/src/number.rs \
              --cargo-test-arg=--lib \
              --cargo-test-arg=--test --cargo-test-arg=mutation_targets \
              --cargo-test-arg=--test --cargo-test-arg=error_codes \
              --cargo-test-arg=--test --cargo-test-arg=masked_errors \
              --cargo-test-arg=--test --cargo-test-arg=line_index \
              --cargo-test-arg=--test --cargo-test-arg=options \
              --cargo-test-arg=--test --cargo-test-arg=spanned \
              --cargo-test-arg=--test --cargo-test-arg=spanned_typed \
              --cargo-test-arg=--test --cargo-test-arg=merge_keys \
              --cargo-test-arg=--test --cargo-test-arg=document_deserializer \
              --cargo-test-arg=--test --cargo-test-arg=frontmatter \
              --cargo-test-arg=--test --cargo-test-arg=round_trips \
              --cargo-test-arg=--test --cargo-test-arg=writer_refusals \
              --cargo-test-arg=--test --cargo-test-arg=contracts \
              --cargo-test-arg=--test --cargo-test-arg=regressions \
              --cargo-test-arg=--test --cargo-test-arg=flow_errors \
              --cargo-test-arg=--test --cargo-test-arg=json_conformance \
              --cargo-test-arg=--test --cargo-test-arg=limit_consistency \
              --cargo-test-arg=--test --cargo-test-arg=shared_vectors \
              --cargo-test-arg=--test --cargo-test-arg=typed_paths \
              --cargo-test-arg=--test --cargo-test-arg=typed_readers \
              --cargo-test-arg=--test --cargo-test-arg=state_machines \
              --cargo-test-arg=--test --cargo-test-arg=compat_alias_keys \
              --shard "$SHARD" \
              --timeout 30 \
              --jobs 1 \
              --gitignore=true
          )
          status=$?
          # cargo-mutants exits 3 when both timeouts and missed mutants occur; inspect
          # `mutants.out/missed.txt` so timeouts never hide surviving mutants.
          missed=0
          if [ -f mutants.out/missed.txt ]; then
            missed=$(grep -c '[^[:space:]]' mutants.out/missed.txt || true)
          fi
          if [ "$missed" -gt 0 ] || [ "$status" -eq 2 ]; then
            echo "::error::unexpected surviving mutants ($missed) recorded in mutants.out/missed.txt"
            exit 2
          fi
          case "$status" in
            0) exit 0 ;;
            3) echo "::warning::infinite-loop mutant timeouts recorded in mutants.out/timeout.txt (0 survivors)"; exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Summarize shard trend
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("mutants.out")
          out.mkdir(exist_ok=True)
          counts = {}
          for name in ("caught", "missed", "timeout", "unviable"):
              path = out / f"{name}.txt"
              lines = [l for l in path.read_text().splitlines() if l.strip()] if path.exists() else []
              counts[name] = len(lines)
          total = sum(counts.values())
          tested = counts["caught"] + counts["missed"] + counts["timeout"]
          kill_rate = (counts["caught"] / tested * 100.0) if tested else 100.0
          summary = {
              "package": "ayaml",
              "shard": os.environ["SHARD"],
              "counts": counts,
              "total": total,
              "kill_rate_pct": round(kill_rate, 2),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          md = (
              f"### Mutation shard `ayaml` `{summary['shard']}`\n\n"
              f"- Caught: **{counts['caught']}**\n"
              f"- Missed (survivors): **{counts['missed']}**\n"
              f"- Timeout: **{counts['timeout']}**\n"
              f"- Unviable: **{counts['unviable']}**\n"
              f"- Kill rate: **{summary['kill_rate_pct']}%**\n"
          )
          (out / "summary.md").write_text(md)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write(md + "\n")
          print(md)
          PY
      - name: Upload mutation outcomes and trend summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-ayaml-shard-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 90

  mutants-edit:
    name: mutants ayaml-edit (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run bounded mutation shard (ayaml-edit)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          (
            ulimit -v 6291456 || exit 125
            timeout -k 10 2700 nice -n 10 cargo mutants \
              --package ayaml-edit \
              --file crates/ayaml-edit/src/lib.rs \
              --cargo-test-arg=--lib \
              --cargo-test-arg=--test --cargo-test-arg=edits \
              --cargo-test-arg=--test --cargo-test-arg=api_freeze \
              --cargo-test-arg=--test --cargo-test-arg=migration_guides \
              --shard "$SHARD" \
              --timeout 30 \
              --jobs 1 \
              --gitignore=true
          )
          status=$?
          missed=0
          if [ -f mutants.out/missed.txt ]; then
            missed=$(grep -c '[^[:space:]]' mutants.out/missed.txt || true)
          fi
          if [ "$missed" -gt 0 ] || [ "$status" -eq 2 ]; then
            echo "::error::unexpected surviving mutants ($missed) recorded in mutants.out/missed.txt"
            exit 2
          fi
          case "$status" in
            0) exit 0 ;;
            3) echo "::warning::infinite-loop mutant timeouts recorded in mutants.out/timeout.txt (0 survivors)"; exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Summarize shard trend
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("mutants.out")
          out.mkdir(exist_ok=True)
          counts = {}
          for name in ("caught", "missed", "timeout", "unviable"):
              path = out / f"{name}.txt"
              lines = [l for l in path.read_text().splitlines() if l.strip()] if path.exists() else []
              counts[name] = len(lines)
          total = sum(counts.values())
          tested = counts["caught"] + counts["missed"] + counts["timeout"]
          kill_rate = (counts["caught"] / tested * 100.0) if tested else 100.0
          summary = {
              "package": "ayaml-edit",
              "shard": os.environ["SHARD"],
              "counts": counts,
              "total": total,
              "kill_rate_pct": round(kill_rate, 2),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          md = (
              f"### Mutation shard `ayaml-edit` `{summary['shard']}`\n\n"
              f"- Caught: **{counts['caught']}**\n"
              f"- Missed (survivors): **{counts['missed']}**\n"
              f"- Timeout: **{counts['timeout']}**\n"
              f"- Unviable: **{counts['unviable']}**\n"
              f"- Kill rate: **{summary['kill_rate_pct']}%**\n"
          )
          (out / "summary.md").write_text(md)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write(md + "\n")
          print(md)
          PY
      - name: Upload mutation outcomes and trend summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-edit-shard-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 90
