name: leak gate

# Separate from ci.yml so that editing a pull request's title or body re-runs
# only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  leak-scan:
    name: leak scan
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned scanner
        run: echo "AYAML_GITLEAKS=$(tools/leak-scan/install-gitleaks.sh "$RUNNER_TEMP/gitleaks")" >> "$GITHUB_ENV"
      - name: Test the gate
        run: python3 tools/leak-scan/test_gate.py
      - name: Scan commits and tree
        env:
          AYAML_LEAK_PATTERNS: ${{ secrets.AYAML_LEAK_PATTERNS }}
          # A tag is scanned by name, so that its message is read. A push to main is
          # compared with what it replaced, and any other push with main.
          HEAD_REV: ${{ github.event.pull_request.head.sha || (startsWith(github.ref, 'refs/tags/') && github.ref) || github.sha }}
          BASE_REV: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || 'refs/remotes/origin/main' }}
          REF_NAME: ${{ github.head_ref || github.ref }}
        run: python3 tools/leak-scan/gate.py scan --head "$HEAD_REV" --not "$BASE_REV" --ref "$REF_NAME"
      - name: Scan the pull request's title and body
        if: github.event_name == 'pull_request'
        env:
          AYAML_LEAK_PATTERNS: ${{ secrets.AYAML_LEAK_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/leak-scan/gate.py text PR_TITLE PR_BODY
