name: fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: nightly fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse, emit, borrowed]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
            fuzz-corpus-
      # Installed before the run, so that a crash can't be lost to a failed install. See D74.
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Build fuzzer
        run: cargo fuzz build ${{ matrix.target }} --target x86_64-unknown-linux-gnu
      - name: Run fuzzer
        run: tools/fuzz-hosted.sh ${{ matrix.target }} 60 "$RUNNER_TEMP/fuzz-encrypted"
      - name: Upload what it found, encrypted
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-encrypted
          path: ${{ runner.temp }}/fuzz-encrypted
          if-no-files-found: ignore
