name: fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: nightly fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse, emit, borrowed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
            fuzz-corpus-
      # Installed before the run, so that a crash can't be lost to a failed install. See D74.
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Build fuzzer
        run: cargo fuzz build ${{ matrix.target }} --target x86_64-unknown-linux-gnu
      - name: Run fuzzer
        run: tools/fuzz-hosted.sh ${{ matrix.target }} 60 "$RUNNER_TEMP/fuzz-encrypted"
      - name: Upload what it found, encrypted
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-encrypted
          path: ${{ runner.temp }}/fuzz-encrypted
          if-no-files-found: ignore
