[workspace]
resolver = "3"
members = [
    "crates/ayaml",
    "crates/ayaml-bench",
    "crates/ayaml-conformance",
    "crates/ayaml-edit",
    "crates/ayaml-fixtures",
    "crates/xtask",
]
exclude = ["target"]
default-members = ["crates/ayaml"]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asamarts/ayaml"
documentation = "https://docs.rs/ayaml"
readme = "README.md"
keywords = ["yaml", "parser", "serde", "serialization", "no-unsafe"]
categories = ["parser-implementations", "encoding", "development-tools"]

[workspace.dependencies]
# 2.6.0 is the first release whose owning iterator is `Clone`, which `mapping::IntoIter` is.
indexmap = "2.6.0"
serde = "1.0.220"
serde_json = "=1.0.154"
proptest = "=1.10.0"
criterion = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
# Set by the test run that reads every typed input from its events (see `typed.rs`) and by Kani.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ayaml_typed_from_events)', 'cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
literal_string_with_formatting_args = "warn"
mem_forget = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
