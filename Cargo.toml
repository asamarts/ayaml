[workspace]
resolver = "3"
members = [
    "crates/ayaml",
    "crates/ayaml-conformance",
]
default-members = ["crates/ayaml"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asamarts/ayaml"
homepage = "https://github.com/asamarts/ayaml"
documentation = "https://docs.rs/ayaml"
readme = "README.md"
keywords = ["yaml", "parser", "serde", "serialization", "no-unsafe"]
categories = ["parser-implementations", "encoding", "development-tools"]

[workspace.dependencies]
indexmap = "=2.14.2"
serde = "=1.0.229"
yaml_serde = "=0.10.7"
serde_json = "=1.0.154"
proptest = "=1.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
