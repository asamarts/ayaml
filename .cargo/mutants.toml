# Bounded mutation testing defaults for hosted CI (AY-037).
#
# Never run limit-disabling mutants on a shared host: turning off an alias,
# depth, or expansion guard can turn adversarial tests into real memory
# exhaustion. Limit enforcement lives in `limits.rs` and is excluded below,
# alongside the benchmark and conformance harness crates.

gitignore = true
additional_cargo_args = ["--locked", "--jobs", "2"]
# Run the fast library unit tests and targeted integration tests (skipping the 60s
# child-process `adversarial` and `properties` suites; limit guards are excluded below).
additional_cargo_test_args = [
    "--lib",
    "--test", "mutation_targets",
    "--test", "line_index",
    "--test", "options",
    "--test", "spanned",
    "--test", "round_trips",
    "--test", "writer_refusals",
    "--test", "contracts",
    "--test", "regressions",
]

exclude_globs = [
    "crates/ayaml/src/limits.rs",
    "crates/ayaml-bench/**",
    "crates/ayaml-conformance/**",
]

exclude_re = [
    "check_depth",
    "check_input",
    "check_documents",
    "check_scalar_bytes",
    "check_collection_entries",
    "check_events",
    "check_anchors",
    "check_alias_dereferences",
    "check_alias_expansion",
    "check_output_bytes",
    "check_tag_expansion",
    "expansion_budget",
    "AliasBudget::charge",
    "Limits::validate",
    "Limits::is_valid",
    "LimitExceeded",
    "kani_proofs",
]
