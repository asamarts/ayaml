[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
