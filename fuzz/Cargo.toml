[package]
name = "ayaml-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# `libyaml-compat` is only used by compatibility checks; the default parser is
# unchanged.
ayaml = { path = "../crates/ayaml", version = "=0.1.0", features = ["libyaml-compat"] }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "borrowed"
path = "fuzz_targets/borrowed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "emit"
path = "fuzz_targets/emit.rs"
test = false
doc = false
bench = false

[workspace]
