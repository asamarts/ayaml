[package]
name = "ayaml-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# `libyaml-compat` is only used by compatibility checks; the default parser is
# unchanged.
ayaml = { path = "../crates/ayaml", version = "=0.1.2", features = ["libyaml-compat"] }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "borrowed"
path = "fuzz_targets/borrowed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "emit"
path = "fuzz_targets/emit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "memcount"
path = "src/bin/memcount.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "warn"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
literal_string_with_formatting_args = "warn"
mem_forget = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"

[workspace]
