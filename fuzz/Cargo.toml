[package]
name = "ayaml-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Structure-aware generation for the fuzz harnesses. Version matches `libfuzzer-sys`'s own dep.
arbitrary = "=1.5.0"
# `libyaml-compat` is only used by compatibility checks; the default parser is
# unchanged. `bench-internals` gives typed-equivalence targets the tree-backed reader to compare
# with the event-stream reader.
ayaml = { path = "../crates/ayaml", version = "=0.2.3", features = ["bench-internals", "libyaml-compat"] }
ayaml-fixtures = { path = "../crates/ayaml-fixtures" }
libfuzzer-sys = "=0.4.13"
# Typed deserialization targets in `typed_equiv` and `masked_errors`.
serde = { version = "=1.0.229", features = ["derive"] }
# `memcount` uses this for the JSON tree that its untyped decode builds, and `borrowed` /
# `typed_equiv` for a target that isn't ayaml's own. The version is the workspace's.
serde_json = "=1.0.154"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "borrowed"
path = "fuzz_targets/borrowed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "emit"
path = "fuzz_targets/emit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured"
path = "fuzz_targets/structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spanned"
path = "fuzz_targets/spanned.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge_keys"
path = "fuzz_targets/merge_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "masked_errors"
path = "fuzz_targets/masked_errors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_emit"
path = "fuzz_targets/event_emit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_equiv"
path = "fuzz_targets/typed_equiv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "memcount"
path = "src/bin/memcount.rs"
doc = false
bench = false

[lints.rust]
unsafe_code = "warn"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
literal_string_with_formatting_args = "warn"
mem_forget = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"

[workspace]
