# A compact nested sequence holds one argument per line. Reduced from
# rust-lang/stdarch, crates/stdarch-gen-arm/spec/neon/arm_shared.spec.yml.
intrinsics:
  - name: "vand{neon_type.no}"
    compose:
      - FnCall:
          - simd_and
          - - a
            - b
  - name: "vabd{neon_type.no}"
    compose:
      - FnCall: [simd_cast, [{FnCall: ["vabd_{neon_type[0]}", [c, d]]}]]
